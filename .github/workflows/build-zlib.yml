name: build-zlib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64
    steps:
      - name: Build PHP 8.4.2 with zlib shared
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fsSL -o zlib.tgz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf zlib.tgz
          cd zlib-1.3.1
          ./configure --static --prefix=/tmp/zlibinst
          make CFLAGS="-fPIC -O2" -j"$(nproc)"
          make install
          cd /tmp
          curl -fsSL -o php.tar.gz https://www.php.net/distributions/php-8.4.2.tar.gz
          tar xzf php.tar.gz
          cd php-8.4.2
          ZLIB_CFLAGS="-I/tmp/zlibinst/include" ZLIB_LIBS="/tmp/zlibinst/lib/libz.a" ./configure --disable-all --with-zlib=shared
          make -j"$(nproc)"
          ls -la modules/
          ldd modules/zlib.so || true
          mkdir -p /tmp/out
          cp modules/zlib.so /tmp/out/zlib-8.4.2.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlib-so-php84
          path: /tmp/out/*
